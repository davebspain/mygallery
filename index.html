
<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Photo Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      text-align: center;
      padding: 35px 20px;
      background: #24292f;
      color: white;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 2.2rem;
    }

    header p {
      margin: 0;
      color: #ddd;
    }

    .gallery {
      max-width: 1400px;
      margin: 0 auto;
      padding: 25px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .gallery img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      border-radius: 10px;
      cursor: pointer;
      background: #ddd;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .gallery img:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 18px #0003;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.92);
      justify-content: center;
      align-items: center;
      padding: 50px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
      background: transparent;
      cursor: default;
    }

    .close {
      position: absolute;
      top: 12px;
      right: 25px;
      font-size: 42px;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .gallery img {
        height: 200px;
      }
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        padding: 12px;
      }

      .gallery img {
        height: 160px;
      }

      header h1 {
        font-size: 1.8rem;
      }

      .lightbox {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>My Photo Gallery</h1>
    <p>Explore my collection of 20 photos</p>
  </header>

  <main class="gallery" id="gallery"></main>

  <div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Enlarged photo"
    onclick="closeImage(event)"
  >
    <button
      class="close"
      aria-label="Close image"
      onclick="closeImage(event)"
    >&times;</button>

    <img id="largeImage" src="" alt="Enlarged gallery photo">
  </div>

  <footer>
    &copy; 2026 My Photo Gallery
  </footer>

  <script>
    const gallery = document.getElementById("gallery");

    for (let i = 1; i <= 20; i++) {
      const img = document.createElement("img");

      img.src = `image${i}.jpg`;
      img.alt = `Gallery photo ${i}`;
      img.loading = "lazy";

      img.addEventListener("click", () => {
        const lightbox = document.getElementById("lightbox");
        const largeImage = document.getElementById("largeImage");

        largeImage.src = img.src;
        largeImage.alt = img.alt;

        lightbox.classList.add("active");
      });

      img.onerror = () => {
        console.error("Could not load: " + img.src);
      };

      gallery.appendChild(img);
    }

    function closeImage(event) {
      if (
        event.target.id === "lightbox" ||
        event.target.classList.contains("close")
      ) {
        document.getElementById("lightbox")
          .classList.remove("active");
      }
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        document.getElementById("lightbox")
          .classList.remove("active");
      }
    });
  </script>

</body>
</html>
